# Measured facts, quoted by the site's prose rather than typed into it.
#
# Every number here was measured against a real system and could change if
# measured again. Read it with wq_fact() from R/facts.R; see
# process/DESIGN-fact-table.md for why this file exists.
#
# Nothing definitional belongs here. EPSG:27700, the 1024-byte ODBC truncation
# modulus and DefaultStringColumnLength = 65535 are properties of a standard or
# an API, not observations, and they stay written into the prose.
#
# Prefer an executing chunk to an entry here. Where a page can compute the
# number next to the code that produced it, the two cannot disagree, and that
# is strictly better than this file. Entries here are for facts the render
# must not recompute, because doing so would need compute it cannot assume.
#
# Fields:
#   value     the measurement, as a bare number
#   unit      what it counts
#   measured  ISO date the measurement was taken
#   compute   what it was measured on; a count without this is meaningless
#   method    how, where that is not obvious
#   volatile  true if it can change under us without anyone touching the site
#   round     the rounded spelling, where the prose deliberately uses one
#   approx    prose spellings that deliberately approximate this fact. They stay
#             literal, because "Thirty-two million rows go in and about a
#             thousand come back" is a sentence about scale, not a citation, and
#             wq_fact() would encode a precision it does not claim. Listed so
#             that re-measuring shows what else a reader might notice.
#   note      anything a reader of the entry needs in order to trust it
#   used_by   every page quoting it, which is what makes a change tractable

spatial_functions_warehouse:
  value: 97
  unit: functions
  measured: 2026-08-24
  compute: Pro warehouse, serverless
  method: SHOW FUNCTIONS LIKE 'st_*', counting distinct names
  volatile: true
  note: >
    Distinct names, with no aliases inflating the count and no separate
    geography family counted twice. Two are aggregates and five are geography
    constructors. Counting only what you would call a spatial operation gives
    the same figure.
  used_by:
    - ref/spatial-functions.qmd
spatial_functions_cluster:
  value: 93
  unit: functions
  measured: 2026-08-24
  compute: all-purpose cluster, DBR 18.1
  method: SHOW FUNCTIONS LIKE 'st_*' through Spark, counting distinct names
  volatile: true
  note: >
    Four fewer than the warehouse: st_makepoint, st_makeenvelope,
    st_pointonsurface and st_collect are absent, and nothing is present that
    the warehouse lacks.
  used_by:
    - ref/spatial-functions.qmd
