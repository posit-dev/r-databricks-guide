# What each page's claims rest on, keyed by page.
#
# This is build metadata, not reader-facing prose. It used to sit at the foot
# of each page as a "This page rests on:" line, which published a research
# artefact to a scientist who had not asked for one. Moved here on 2026-09-02
# after an isolated reader review; see process/DESIGN-reader-review.md.
#
# Three things read it, none of them the reader:
#
#   1. Matching an upstream changelog entry's `Bears on:` line to the pages it
#      affects, without either repo knowing the other's internals. This is the
#      primary consumer; see process/upstream-changelog.md.
#   2. The factual budget for anyone drafting a page. Only claims listed here
#      may appear on that page. Code may demonstrate a claim already listed,
#      never establish a new one.
#   3. Which compute a page needs, which is read off its claims rather than
#      stored: a page needs a cluster only if it rests on a claim about worker
#      machines, distributed execution, forked workers on cluster compute, or
#      cluster metadata. Everything about queries, pushdown, geometry
#      transport, types and licences is warehouse work. That judgement was not
#      mechanised here, because neither the claims nor the page's own chunks
#      predict it reliably: example/bootstrap.qmd needs WQ_RUN_CLUSTER=true
#      and says so nowhere a script can see.
#
# Fields:
#   claims    one claim per item, phrased as a claim rather than a file
#             reference, so a changelog entry can be matched against it.
#             Splitting them out means one clause can be retracted without
#             touching the rest, which has already been needed once.
#
# A page with no entry rests on no measured claim. Do not add an empty entry.
#
# ref/when-it-breaks.qmd is the exception and deliberately has no claims of its
# own: it is symptom-shaped, and every entry on it inherits the claims of the
# page it routes to. A changelog entry matching any of those pages should be
# checked against its symptom wording too.
#
# Widening a page's claims is a scaffolding decision, not a drafting one.
# Read process/upstream-changelog.md before doing it.


concepts/index.qmd:
  claims:
    - '`spark_apply()` has been observed distributing tasks across two worker machines, neither of them the driver'
    - '`spark_apply()` was slower than forked workers on a single node'
    - '`spark_apply(group_by =)` fails on `rpy2` 3.6.x'
    - '`spark_apply(columns =)` takes a Spark type string from a client connection and a character vector on the cluster''s own R session, and the wrong form fails without naming the argument'
    - 'every R context gets its own ephemeral library'

howdoi/big-table.qmd:
  claims:
    - 'a 32.5 million row table reduces by three orders of magnitude before crossing into R'
    - '`dplyr::sql()` reaches Spark SQL functions `dbplyr` cannot translate'
    - '`UNRESOLVED_ROUTINE` is raised identically for an untranslated function, a function absent from the connected compute, and a misspelling'
    - 'Spark SQL has no ordinal-regression primitive'

howdoi/check-the-answer.qmd:
  claims:
    - 'worker-computed polygon area matched the warehouse''s own to a relative difference of 3.1e-12'
    - 'hashing an R object is not portable across R minor versions'
    - 'distance, length and area on the server''s geometry type are planar while `sf` on unprojected coordinates is spherical, so the two disagree silently by orders of magnitude with neither being wrong'
    - 'the same modelling difference makes predicates disagree on boundaries alone, which surfaces as a count a few rows out rather than as a difference in magnitude, so ranking a discrepancy by size does not find it'
    - 'projecting the coordinates removes both, because `sf` uses s2 only for longitude and latitude'

howdoi/compute.qmd:
  claims:
    - '`num_workers = 0` means a single machine'
    - 'a Standard access-mode cluster refuses R notebooks while a client connection to one works'
    - 'whether `spark_apply()` works under Standard access mode is unresolved'
    - 'a cluster''s runtime version and its setup script are one decision, and a script left attached across a runtime change either leaves packages missing or recompiles them at every start'

howdoi/connect.qmd:
  claims:
    - 'ODBC truncates `BINARY` values to length mod 1024 at every setting tried, returning a correct prefix so nothing errors'
    - 'the text truncation applies to any long string value, including geometry a server-side function produced rather than a column read from a table, and the truncated value still parses'
    - '`brickster::DatabricksSQL()` returns `BINARY` byte-exact'
    - 'the server-side text encoding workaround meets a separate silent truncation at 1,023 characters unless the driver''s string-length setting is raised, and a round number there can be silently dropped'
    - 'both truncation bugs have unmerged fix PRs open against the driver package'
    - '`config::get()` falls back to the default profile without warning when a profile name is unrecognised'

howdoi/interactive.qmd:
  claims:
    - 'an interactive R session can drive cluster compute through a client connection, without an R notebook attached to the cluster'
    - '`spark_apply(columns =)` takes a Spark type string from a client connection and a character vector on the cluster''s own R session, and the wrong form fails without naming the argument'

howdoi/monte-carlo.qmd:
  claims:
    - 'a 32.5 million row table shrinks server-side to a small result before the expensive work starts'
    - 'forked parallel workers reduced peak R memory rather than increasing it'
    - '`spark_apply()` was slower than forked workers on a single node'
    - '`spark_apply()` has been observed distributing tasks across two worker machines, neither of them the driver'
    - '`spark_apply(group_by =)` fails on `rpy2` 3.6.x, and where it ran was slower than the default partitioning'
    - '`spark_apply(columns =)` takes a Spark type string from a client connection and a character vector on the cluster''s own R session, and the wrong form fails without naming the argument'

howdoi/polygons.qmd:
  claims:
    - 'the platform reports 97 distinct built-in `ST_` functions on a Pro warehouse running serverless, and 93 on an all-purpose cluster, where `st_makepoint`, `st_makeenvelope`, `st_pointonsurface` and `st_collect` are absent'
    - '`st_makevalid`, `st_relate`, `st_voronoi` and about twenty other `sf` staples are absent from both'
    - 'an unknown-function error differs only in the name it quotes, whether the function exists on other compute or was never a function at all'
    - '`st_distance` rejects a geography argument, so geography is not a cast away from a flat answer, while `st_distancesphere` and `st_distancespheroid` give the sphere''s and the ellipsoid''s answers in metres where the planar call returns degrees'
    - 'one modelling difference explains every divergence between `sf` and the server, `sf` using s2 spherical geometry for longitude and latitude since version 1.0 while the server discards the coordinate system and works planar'
    - 'it surfaces twice, in measures that differ by five orders of magnitude and in predicates that differ only on boundaries, where a point on the interior of a polygon edge is TRUE to `st_intersects`, `st_covers` and `st_touches` on the server and FALSE in `sf` while interior and exterior points agree, so "measures are unsafe and predicates are safe" is false'
    - 'projecting the coordinates removes both, because `sf` engages s2 only for longitude and latitude'
    - 'five things do not, namely attaching `sf`, tagging the SRID, changing connection path between `odbc`, `brickster` and `sparklyr`, any automated guard, since `dbplyr` builds SQL before consulting the server, and `sf_use_s2(FALSE)`, which selects an ellipsoidal rather than a planar model and so repairs the predicates while leaving the measures wrong'
    - 'twenty-two `sf` export names exist on both sides and the other ninety-four fail loudly, counted once against one runtime and one `sf` version'
    - '`st_transform` works server-side between EPSG:4326 and EPSG:27700'
    - 'geometry is stored as WKB with no embedded SRID'
    - 'polygon area aggregates server-side with only a scalar crossing'
    - '`dbplyr` sends an untranslated function name to the server verbatim, so a spatial expression pushes down from an ordinary `dplyr` pipeline and is never evaluated by `sf`, whether or not `sf` is attached'
    - 'a spatial predicate cannot be a `join_by()` condition, and `cross_join()` followed by a filter on the predicate is planned as the same join'

howdoi/results.qmd:
  claims:
    - 'every R context gets its own ephemeral library, so installs do not persist between contexts'
    - 'a prebuilt library tree on a volume can be reused'
    - '`dbWriteTable()` hard errors above 50,000 rows without a staging volume'

howdoi/terra.qmd:
  claims:
    - 'the native `ST_` functions are vector functions with no raster equivalent, so gridded work has no server-side path'
    - 'a disk-backed raster object serialises its file path rather than its pixels'

howdoi/volume-files.qmd:
  claims:
    - '`/Volumes/...` is not resolvable from a remote R session, and `readr`, `arrow` and `sf` all fail there with a message indistinguishable from a typo'
    - '`db_volume_read()` and `db_volume_write()` move bytes without parsing, so every format including xlsx round-trips intact, and neither needs a cluster or a warehouse'
    - '`db_volume_read()` takes no `overwrite` argument while `db_volume_write()` and the directory functions do'
    - 'a four-part shapefile fetched with `db_volume_download_dir()` reads with its EPSG code preserved, while the same shapefile missing its `.prj` reads with no error or warning and `st_crs()` as `NA`, and missing its `.shx` fails loudly'
    - '`db_volume_file_exists()` throws `HTTP 404` on a missing path rather than returning `FALSE`'
    - '`read_files()` over a volume path composes with `dbplyr` through `tbl(con, sql(...))`, reads every file in a directory regardless of extension, and does not support xlsx'
    - 'the documented per-file ceiling is 5 GiB'
    - 'reading and writing inside a volume needs `READ VOLUME` and `WRITE VOLUME` but not `CREATE VOLUME`'

example/bootstrap.qmd:
  claims:
    - 'adding a two-column matrix to an `sfc` recycles the matrix per geometry rather than shifting point `i` by row `i`, costing gigabytes in GEOS that never appear in R''s `gc()` accounting, so coordinate jitter must be done on a plain matrix'
    - 'the catchment column that reads as an overall grade is unusable, with nearly all rows "Not assessed", while `ecological_class` carries a usable ordinal grade, so the distribution of a categorical column is worth reading before it is relied on'
    - 'decoded catchment area matches the declared area column to thousandths of a percent'
    - '`spark_apply()` on the Databricks Connect backend does not capture the calling environment and rejects `context =` outside the `group_by` path, so geometry must travel as a column in the Spark table'
    - '`spark_apply()` has been observed distributing work across two worker machines, neither of them the driver, with `sf` loaded and doing real spatial work'
    - 'one R process runs per task and a task gets one core, so partition count controls how much of a machine is used'
    - '`sf` is absent from a stock cluster image and must be installed on every node'
    - '`future` and `furrr` are absent from the cluster runtime bundle while base `parallel` is present'

example/connecting.qmd:
  claims:
    - 'ODBC truncates `BINARY` values to length mod 1024 at every setting tried, so a 1,025-byte value returns 1 byte with no error'
    - '`brickster::DatabricksSQL()` returns `BINARY` byte-exact'
    - 'encoded geometry as text is separately truncated at 1,023 characters unless `DefaultStringColumnLength` is raised, and a round number there can be silently dropped'
    - 'decoded catchment area matches the table''s declared area column to within thousandths of a percent'
    - '`config::get()` falls back to the default profile without warning when a profile name is unrecognised'

example/ingest.qmd:
  claims:
    - '`dbWriteTable()` through the DBI backend works to about 50,000 rows and warns from about 20,000, so bulk loading goes through a volume and `read_files()`'
    - '`read_files()` reads every file in the directory it is given regardless of extension, so a re-run with a fresh filename doubles the row count and a mixed directory fails rather than reading the files it recognises'
    - 'encoding catchment geometry as WKB is far faster than WKT and produces a smaller value'
    - '`hydrology_stations` carries easting/northing in EPSG:27700 and no lon/lat, while `storm_overflows` carries lon/lat in EPSG:4326'
    - '`station_id` lives on the measures table rather than the readings table'
    - 'the storm overflow locations are CC BY 4.0 rather than OGL'

example/parallel.qmd:
  claims:
    - '`future` and `furrr` are absent from the cluster runtime bundle while `sf`, `dplyr` and base `parallel` are present on the workers, confirmed by asking the workers directly'
    - 'forked parallel workers share what the parent already held, because the fork is copy-on-write, but each pays in full for whatever it allocates itself'
    - '`detectCores()` reports the host''s cores rather than the container''s CPU quota, so forking on its answer overcommits and the session is killed without an error message'
    - 'whether a `future` multicore plan behaves correctly under a Spark executor is untested'

example/reducing.qmd:
  claims:
    - 'the readings table holds about 32.5 million rows spanning 2015 to 2024'
    - 'roughly 80% of readings carry quality `Good`'
    - '`grepl()` has no Spark SQL translation and fails server-side with `UNRESOLVED_ROUTINE`, so `dplyr::sql()` is needed to match on `value_statistic`'
    - 'filtering the measures table before the join rather than the readings table after it is what keeps the join small'
    - 'the reduction yields about a thousand stations and a few hundred kilobytes'

example/results.qmd:
  claims:
    - '`dbWriteTable()` fails hard at about 50,000 rows, so a large result needs the volume route'
    - 'environmental agency data is OGL v3.0 while storm overflow locations are CC BY 4.0'
    - 'an `renv.lock` pins this session''s package versions but reaches neither the cluster runtime nor the worker library'
    - 'per-unit seeding reproduces only for a fixed partitioning'

example/simulation.qmd:
  claims:
    - 'per-station mean and standard deviation of daily flow are sufficient to parameterise a lognormal without a second pass over the readings'
    - 'the count of days behind each fit is available in the same summary, so the sampling error of those two parameters can be formed without returning to the readings either'
    - 'about a thousand stations at a thousand draws each finishes on a handful of local cores'
    - 'on a single-node cluster `parallel::mclapply()` in one cluster-side session was over twice as fast as `spark_apply()` for the same draws'
    - '`spark_apply(group_by =)` uses one R process where the partition path uses several, runs slower for an identical answer, and fails outright on `rpy2` 3.6.x'

example/spatial.qmd:
  claims:
    - 'catchment geometry is stored as `BINARY` and must be base64-encoded server-side to travel over ODBC'
    - 'WKB carries no SRID, so the CRS must be supplied and is EPSG:27700 for this data'
    - 'decoded catchment area agrees with the table''s declared area column to within thousandths of a percent'
    - 'storm overflow locations are EPSG:4326 and need transforming before they will join'
    - 'about 92% of overflows fall inside a river catchment, the remainder being coastal'

ref/packages.qmd:
  claims:
    - 'every R context gets its own ephemeral library'
    - 'a prebuilt library tree on a volume, prepended to `.libPaths()`, is reusable by a later cluster with the same R version and image and works inside a `spark_apply()` worker'
    - 'the stock runtime image ships no GDAL, GEOS or PROJ, so `install.packages("sf")` fails at configure'
    - 'an init script runs on every node where an interactive install touches only the driver'
    - 'a worker''s R patch version can differ from the session''s'

ref/related-work.qmd:
  claims:
    - 'none of the seventeen `spark.posit.co/guides/` pages mentions Databricks or Spark Connect, and `deployment/databricks-connect.html` is not linked from them'
    - 'sparklyr''s caching guide teaches `memory = TRUE` and `compute()`, which upstream states do not work on serverless'
    - 'the S3 guide''s mechanism requires adding a Hadoop jar to a managed cluster''s classpath'
    - '`rsparkling` is off CRAN'
    - 'the sparklyr `tidymodels` integration is a translation layer over MLlib with no `recipes` support, while `tune_grid_spark()` runs R on the executors and requires R and modelling packages on every node'
    - 'brickster''s documentation states no data type behaviour in either direction, its DBI backend is warehouse-only, `db_repl()` is cluster-only and R only on single-user clusters, and its cluster-management article assumes create rights'
    - 'Posit''s Databricks pages recommend `odbc` without qualification and do not mention brickster'
    - 'none of the three sites documents the symptom of an expired credential, and Posit''s only troubleshooting page covers ODBC driver installation'
    - 'brickster 0.2.14 and sparklyr 1.9.5 are both current CRAN releases, published 2026-07-24 and 2026-06-20'

ref/sending-things.qmd:
  claims:
    - '`brickster::db_volume_write()` works and the worker reads the result as a local file, up to 5 GiB'
    - 'serialising into the closure body works but needs `version = 2` and stripped line breaks, and both failures report `unknown type 0`'
    - '`dbWriteTable()` hard errors above 50,000 rows without a staging volume'
    - '`spark_apply(context =)` does not work on the `databricks_connect` backend'
    - 'a `BINARY` column arrives in a worker as a text representation'
    - '`columns = list(...)` fails where a Spark DDL string works, the correct form differs between a client connection and the cluster''s own R session, and omitting it works on both'
    - 'a worker''s R patch version can differ from the session''s'

ref/spatial-functions.qmd:
  claims:
    - 'the platform reports 97 distinct built-in `ST_` functions on a Pro warehouse running serverless and 93 on an all-purpose cluster, where `st_makepoint`, `st_makeenvelope`, `st_pointonsurface` and `st_collect` are absent and nothing is present that the warehouse lacks'
    - '`st_point` works on both'
    - 'about twenty `sf` staples including `st_makevalid`, `st_relate` and `st_voronoi` are absent from both'
    - 'an unknown-function error differs only in the name it quotes whether the function exists elsewhere or never existed, while a wrong argument count is distinguishable'
    - '`sf` and the server differ in return shape for `st_contains`, `st_distance` and `st_buffer`'
    - 'self-containment, empty geometry and self-intersection validity agree with `sf`, and so does containment of a point at a polygon''s corner'
    - 'a point on the interior of an edge does not agree on unprojected coordinates, where `st_intersects`, `st_covers` and `st_touches` are TRUE on the server and FALSE in `sf` and `st_disjoint` is the reverse, because `sf` uses s2 spherical geometry for longitude and latitude while the server discards the coordinate system and works planar, and projecting the coordinates makes both sides agree'
    - 'the Classic warehouse exclusion is documented per function and not tested here'

admin/geospatial-setup.qmd:
  claims:
    - 'the stock runtime image ships no GDAL, GEOS or PROJ, so `install.packages("sf")` fails at configure'
    - 'an init script fixes the system layer and runs on every node where an interactive install touches only the driver'
    - 'on older runtimes the image''s pinned `Rcpp` is older than current `units` requires and `terra` must be pinned against the image''s GDAL, and on DBR 18 neither pin is needed'
    - 'a runtime version and its setup script are one decision'
    - 'a binary repository serves sources unless the request''s user agent carries an `R/<version>` token, which `Rscript` omits, costing about fifteen minutes per node'
    - 'a prebuilt library tree on a volume is reusable and works inside a `spark_apply()` worker'
    - 'every R context gets its own ephemeral library'
