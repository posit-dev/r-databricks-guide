project:
  type: website
  output-dir: _site
  # Execute every document from the project root rather than its own folder, so
  # .Renviron (which supplies DATABRICKS_PATH) is read from the working
  # directory at R startup.
  execute-dir: project
  render:
    - index.qmd
    - concepts/*.qmd
    - howdoi/*.qmd
    - example/*.qmd
    - ref/*.qmd
    - admin/*.qmd

website:
  title: "R on Databricks"
  description: "A working guide for R users whose data lives in Databricks."
  # repo-actions needs repo-url alongside it: without the url, Quarto renders the
  # page with only a build-time warning and the edit/issue links never appear.
  repo-url: https://github.com/posit-dev/r-databricks-guide
  repo-branch: main
  repo-actions: [edit, issue]
  # Five sections, in the order she needs them: the mental model first, then the
  # task she arrived with, then the whole thing joined up. Reference and the
  # admin material are lookups rather than reading, so they sit on the right.
  navbar:
    left:
      # No explicit home entry: the site title is the home link, as on
      # quarto.org, sparklyr and pkgdown, which is where this reader already is.
      - href: concepts/index.qmd
        text: Get started
      # Geospatial and simulation are lifted out of Guides as named
      # destinations. Both were undiscoverable inside a nine-item menu, and a
      # reader who did not already know that geometry can live in the database
      # had no way to find the material that says so. The pages stay in
      # howdoi/: this is a nav grouping, not a move, so no cross-reference
      # changes. Revisit if the grouping does not hold.
      - text: Guides
        menu:
          - href: howdoi/connect.qmd
            text: Connect my R session to the data
          - href: howdoi/interactive.qmd
            text: Work in my editor, not a notebook
          - href: howdoi/big-table.qmd
            text: Work with a table that will not fit
          - href: howdoi/compute.qmd
            text: Work out what my cluster can do
          - href: howdoi/results.qmd
            text: Get results out, and repeat them
      - text: Geospatial
        menu:
          - href: howdoi/polygons.qmd
            text: Join and transform polygons
          - href: howdoi/terra.qmd
            text: Work with rasters
      - text: Simulation
        menu:
          - href: howdoi/monte-carlo.qmd
            text: Run a simulation
          - href: howdoi/check-the-answer.qmd
            text: Check I get the same answer
      - text: Worked example
        menu:
          - href: example/index.qmd
            text: The question, and the data
          - href: example/ingest.qmd
            text: Getting the data into Databricks
          - href: example/connecting.qmd
            text: Getting connected and finding the tables
          - href: example/reducing.qmd
            text: Exploring and reducing the big table
          - href: example/spatial.qmd
            text: The spatial join
          - href: example/parallel.qmd
            text: Using the cores you already have
          - href: example/simulation.qmd
            text: Simulating from a summary
          - href: example/bootstrap.qmd
            text: When the simulation carries the geometry
          - href: example/results.qmd
            text: Results, figures, and the record
    right:
      - text: Reference
        menu:
          - href: ref/words.qmd
            text: Same thing, different words
          - href: ref/sending-things.qmd
            text: Sending things to where your code runs
          - href: ref/packages.qmd
            text: Packages
          - href: ref/spatial-functions.qmd
            text: Which spatial functions you have
          - href: ref/when-it-breaks.qmd
            text: When it breaks
          - href: ref/related-work.qmd
            text: Related work
          - text: "---"
          - href: ref/data.qmd
            text: The data and its licences
      - text: For your admin
        menu:
          - href: admin/index.qmd
            text: What to ask for, and how to ask
          - href: admin/geospatial-setup.qmd
            text: Setting up a cluster for geospatial R
  sidebar:
    - title: "Guides"
      style: floating
      contents:
        - howdoi/connect.qmd
        - howdoi/interactive.qmd
        - howdoi/big-table.qmd
        - howdoi/compute.qmd
        - howdoi/results.qmd
    - title: "Geospatial"
      style: floating
      contents:
        - howdoi/polygons.qmd
        - howdoi/terra.qmd
    - title: "Simulation"
      style: floating
      contents:
        - howdoi/monte-carlo.qmd
        - howdoi/check-the-answer.qmd
    - title: "Worked example"
      style: floating
      contents:
        - example/index.qmd
        - example/ingest.qmd
        - example/connecting.qmd
        - example/reducing.qmd
        - example/spatial.qmd
        - example/parallel.qmd
        - example/simulation.qmd
        - example/bootstrap.qmd
        - example/results.qmd
    - title: "For your admin"
      style: floating
      contents:
        - admin/index.qmd
        - admin/geospatial-setup.qmd

# Freeze every document by default. Re-execution then happens only when a
# document's own source changes, which keeps a whole-site render from touching
# Databricks at all. The cluster-backed pages carry a stronger guard on top of
# this: see the `eval` gate in example/parallel.qmd and its siblings.
execute:
  freeze: true

# Redact workspace identifiers from every page. This is a second layer, not
# the only one: it runs at pandoc time, after the freeze cache is written, so
# it protects _site/ but not the tracked _freeze/. Masking a value before it
# is stored is what the knitr hooks in R/setup.R do. See assets/redact.lua.
filters:
  - assets/redact.lua

format:
  html:
    # Both modes must be declared: shipping only the light stylesheet leaves
    # dark mode as unmodified darkly.
    theme:
      light: [cosmo, assets/site.scss]
      dark: [darkly, assets/site-dark.scss]
    toc: true
    df-print: default
    code-copy: true
    code-overflow: wrap
